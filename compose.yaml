services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
  api:
    build: .
    environment:
      ADDR: ":8081"
      MYSQL_DSN: "campusclaw:${MYSQL_PASSWORD}@tcp(db:3306)/campusclaw?parseTime=true&charset=utf8mb4&loc=UTC"
      UPLOAD_DIR: /uploads
      TEACHER_A_PASSWORD: ${TEACHER_A_PASSWORD}
      STUDENT_A1_PASSWORD: ${STUDENT_A1_PASSWORD}
      STUDENT_B1_PASSWORD: ${STUDENT_B1_PASSWORD}
      TEACHER_B_PASSWORD: ${TEACHER_B_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_BASE_URL: http://mcp-demo:8090
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp-demo,localhost,127.0.0.1}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-4}
      MCP_MAX_CALLS: ${MCP_MAX_CALLS:-12}
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  mcp-demo:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: campusclaw
      MYSQL_USER: campusclaw
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  database:
  uploads:
